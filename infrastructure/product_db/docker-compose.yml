services:
  mysql:
    image: mysql:8.0
    container_name: product-db-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: product_db
    ports:
      - "3308:3306"
    volumes:
      - product_db_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  product_db_mysql_data: