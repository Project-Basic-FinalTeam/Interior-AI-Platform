version: '3.8'

# [1] 가상 네트워크 정의 (도커 컨테이너들끼리 통신하는 전용망) 
networks:
  interior_net:
    driver: bridge

# [2] 서비스 정의
services:
  # --------------------------------------------------------
  # 1. Database (PostgreSQL) - 인프라
  # --------------------------------------------------------
  postgres_db:
    image: postgres:15-alpine
    container_name: interior_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: interior_assets
    volumes:
      - ./infrastructure/postgres_db/data:/var/lib/postgresql/data
      - ./infrastructure/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - interior_net

  # --------------------------------------------------------
  # 2. Logic Core (C++ 서버) - 컨트롤 타워
  # --------------------------------------------------------
  logic-cpp:
    build: 
      context: ./services/logic-cpp
    container_name: logic_core
    # ❌ 삭제하세요: network_mode: "host"
    networks:          # ✅ 추가: 같은 네트워크망에 합류
      - interior_net
    ports:             # ✅ [중요] 호스트 모드를 지웠으니 외부(유니티) 통신용 포트를 열어줘야 합니다
      - "5555:5555"    # 5555번 포트를 열어서 유니티와 통신하게 합니다
    volumes:
      - ./services/logic-cpp/src:/app/src:ro
      - ./shared/schema:/app/schema:rw
      - ./shared/assets_3dgs:/app/assets
    depends_on:
      - postgres_db

  # --------------------------------------------------------
  # 3. AI Perception (Python 비전) - 기본 CPU 호환 모드
  # --------------------------------------------------------
  ai-perception:
    build: 
      context: ./services/ai-perception
    container_name: ai_perception
    tty: true
    environment:
      - PYTHONUNBUFFERED=1                  # 로그 즉시 출력 (버퍼링 방지)
      - ZMQ_TARGET_URL=tcp://logic-cpp:5556 # C++ 서버 주소
    volumes:
      - ./services/ai-perception/main.py:/app/main.py:ro # 🔥 [추가] 파이썬 메인 코드 실시간 동기화
      - ./services/ai-perception/modules:/app/modules:ro # 🔥 [추가] Depth, YOLO 등 모듈 실시간 동기화
      - ./shared/models:/app/models:rw      # AI 모델 저장용
      - ./shared/schema:/app/schema:rw      # FlatBuffers 통신용
      - ./shared/assets_3dgs:/app/assets:rw # [중요] 생성된 .ply 파일을 유니티와 공유!
    networks:
      - interior_net
    ports:
      - "5556:5556"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu] # GPU 리소스 예약 (NVIDIA Docker 필요)
      
  # --------------------------------------------------------
  # 4. AI Reconstruction (3DGS 생성) - 기본 CPU 호환 모드
  # --------------------------------------------------------
  ai-reconstruction:
    build: 
      context: ./services/ai-reconstruction
    container_name: ai_reconstruction
    ports:
      - "8000:8000"
    volumes:
      - ./services/ai-reconstruction/main.py:/app/main.py:ro # 🔥 [추가] 파이썬 메인 코드 실시간 동기화
      - ./services/ai-reconstruction/utils:/app/utils:ro     # 🔥 [추가] 유틸리티 로직 실시간 동기화
      - ./services/ai-reconstruction/lgm_core:/app/lgm_core:ro
      - ./shared/models:/app/models:ro
      - ./shared/assets_3dgs:/app/output_assets # 생성된 .ply 저장
    networks:
      - interior_net
    environment:
      - ZMQ_TARGET_URL=tcp://logic-cpp:5557
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu] # GPU 리소스 예약 (NVIDIA Docker 필요)

  # --------------------------------------------------------
  # 5. Matching Engine (GPT & DB) - Lightweight
  # --------------------------------------------------------
  matching-engine:
    build:
      context: ./services/matching-engine
    container_name: matching_engine
    volumes:
      - ./services/matching-engine/src:/app/src:ro           # 🔥 [추가] 매칭 엔진 소스 코드 실시간 동기화
      - ./shared/schema:/app/schema:rw
    networks:
      - interior_net
    environment:
      - DB_HOST=postgres_db
      - DB_USER=admin
      - DB_PASS=secretpassword
      - DB_NAME=interior_assets
      - OPENAI_API_KEY=${OPENAI_API_KEY} # 호스트의 환경변수 읽어오기
      - ZMQ_TARGET_URL=tcp://logic-cpp:5558
    depends_on:
      - postgres_db